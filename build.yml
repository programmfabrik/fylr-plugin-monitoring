# Build configuration for fylr-build-plugin — the explicit build description.
# Delivered files are listed here; "check" (runs with every build) warns when
# a manifest reference is missing from the build folder.
# All features: https://github.com/programmfabrik/fylr-build-plugin

server:
  install:
    - server
    - l10n

webfrontend:
  # assembled into plugin.webfrontend.url, in this order:
  # .coffee is compiled (CoffeeScript 1.x), anything else taken verbatim
  bundles:
    - sources:
        - webfrontend/monitoring-endpoint.coffee
  install:
    - webfrontend/monitoring-endpoint.css

# "pg" is declared in package.json and resolved into the delivered extension by
# the build (#80732) — node_modules never ships, and nothing here has to name
# the dependency.

# monitoringEndpoint.zip is the name this plugin has always published. fylr
# updates a url plugin by re-fetching the url it stored at install time, so
# instances hold that url and it must keep resolving.
zip_aliases:
  - monitoringEndpoint.zip
